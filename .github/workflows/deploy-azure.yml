name: Verify and deploy EasyAD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easyad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ooh_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ooh_market_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ooh_app -d ooh_market_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ooh_app:ci_password@localhost:5432/ooh_market_test
      DATABASE_URL: postgres://ooh_app:ci_password@localhost:5432/ooh_market_test
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_APP_NAME }}
      REGISTRY: ${{ vars.AZURE_REGISTRY }}
      IMAGE: ${{ vars.AZURE_REGISTRY }}.azurecr.io/easyad-web:${{ github.sha }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in RESOURCE_GROUP APP_NAME REGISTRY AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            test -n "${!name}" || { echo "Missing deployment setting $name; check repository secrets and variables." >&2; exit 1; }
          done
      - name: Log in with main-branch OIDC identity
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$REGISTRY"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
      - name: Update EasyAD and verify rollout
        shell: bash
        run: |
          set -euo pipefail
          resource_url="https://management.azure.com/subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${RESOURCE_GROUP}/providers/Microsoft.App/containerApps/${APP_NAME}"
          api_version=2024-03-01
          app=$(az rest --method get --url "$resource_url?api-version=$api_version")
          mode=$(jq -r '.properties.configuration.activeRevisionsMode' <<< "$app")
          test "$mode" = Single || { echo 'Expected Single revision mode; review traffic configuration.' >&2; exit 1; }
          jq -e --arg container "$APP_NAME" \
            '[.properties.template.containers[] | select(.name == $container)] | length == 1' \
            <<< "$app" > /dev/null
          suffix="gh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          revision="${APP_NAME}--${suffix}"
          patch_file=$(mktemp)
          trap 'rm -f "$patch_file"' EXIT
          jq --arg container "$APP_NAME" --arg image "$IMAGE" --arg suffix "$suffix" \
            '.location as $location | .properties.template | .revisionSuffix = $suffix |
             (.containers[] | select(.name == $container) | .image) = $image |
             {location: $location, properties: {template: .}}' <<< "$app" > "$patch_file"
          az rest --method patch --url "$resource_url?api-version=$api_version" \
            --body "@$patch_file" --output none
          ready=false
          for attempt in $(seq 1 60); do
            latest=$(az rest --method get --url "$resource_url?api-version=$api_version" --query properties.latestReadyRevisionName -o tsv)
            if [ "$latest" = "$revision" ]; then
              healthy=$(az rest --method get --url "$resource_url/revisions/$revision?api-version=$api_version" --query properties.healthState -o tsv)
              if [ "$healthy" = Healthy ]; then ready=true; break; fi
            fi
            sleep 10
          done
          test "$ready" = true || { echo "Revision $revision did not become ready." >&2; exit 1; }
          fqdn=$(az rest --method get --url "$resource_url?api-version=$api_version" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 10 --max-time 30 "https://$fqdn/api/health"
          printf 'Deployed `%s` to https://%s\n' "$IMAGE" "$fqdn" >> "$GITHUB_STEP_SUMMARY"
